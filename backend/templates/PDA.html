<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDA</title>

    <link rel="stylesheet" href="/static/css/mediapipe.css">
    <link rel="stylesheet" href="/static/css/PDA/PDA.css">
</head>
<body>

    <div id="camera-layer">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
    </div>

    <div id="cursor"></div>

    <main class="content">

        <a class="back-button" href="/hub" data-gesture-click>
            back
        </a>

        <h1>Personal Digital Notes</h1>

        <a class="create-button" href="/notes/new" data-gesture-click>
            + Nova nota
        </a>

        {{/* Itera sobre as notas passadas pelo handler PDAPage */}}
        {{if .Notes}}
            <div class="notes-list">
                {{range .Notes}}
                <div class="note-card">
                    <h2 class="note-title">{{.Title}}</h2>
                    <p class="note-content">{{.Content}}</p>
                </div>
                {{end}}
            </div>
        {{else}}
            <p class="empty-msg">Nenhuma nota ainda. Crie a primeira!</p>
        {{end}}

    </main>

    <script type="module" src="/static/js/mediapipe-core.js"></script>
    <script type="module" src="/static/js/gesture-system.js"></script>
    <script type="module" src="/static/js/page-a.js"></script>

</body>
</html>
